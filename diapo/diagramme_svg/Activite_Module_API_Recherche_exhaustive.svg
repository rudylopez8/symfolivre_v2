<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="765px" preserveAspectRatio="none" style="width:1529px;height:765px;background:#FFFFFF;" version="1.1" viewBox="0 0 1529 765" width="1529px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="240" x="643.25" y="34.5332">Flux d&#233;taill&#233; de l'API de recherche</text><rect fill="none" height="22.6406" style="stroke:none;stroke-width:1.0;" width="1496.5" x="15" y="51.0645"/><ellipse cx="183" cy="88.7051" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="324" x="21" y="118.7051"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="304" x="31" y="141.1621">Envoie requ&#234;te GET /api/books (param&#232;tre titre ou isbn)</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="206" x="80" y="676.4551"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="186" x="90" y="698.9121">Traite la r&#233;ponse JSON ou l'erreur</text><ellipse cx="183" cy="742.5488" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="183" cy="742.5488" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="51.0645" y2="753.5488"/><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="265" x="726.125" y="173.7988"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="245" x="736.125" y="196.2559">Intercepte la demande via le routeur Symfony</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="375" x="671.125" y="228.8926"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="355" x="681.125" y="251.3496">V&#233;rifie si le param&#232;tre est un ISBN (format 13 chiffres) ou un Titre</text><polygon fill="#F1F1F1" points="814.125,283.9863,903.125,283.9863,915.125,295.9863,903.125,307.9863,814.125,307.9863,802.125,295.9863,814.125,283.9863" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="89" x="814.125" y="300.4873">Param&#232;tre valide ?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="16" x="786.125" y="293.5693">Oui</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19" x="915.125" y="293.5693">Non</text><polygon fill="#F1F1F1" points="614.75,468.2676,696.75,468.2676,708.75,480.2676,696.75,492.2676,614.75,492.2676,602.75,480.2676,614.75,468.2676" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="82" x="614.75" y="484.7686">R&#233;sultat trouv&#233; ?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="16" x="586.75" y="477.8506">Oui</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19" x="708.75" y="477.8506">Non</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="313" x="355" y="502.2676"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="293" x="365" y="524.7246">Transforme l'entit&#233; Livre en format JSON via Serializer</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="259" x="382" y="557.3613"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="239" x="392" y="579.8184">Envoie r&#233;ponse HTTP 200 OK + Body JSON</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="217" x="691.5" y="502.2676"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="197" x="701.5" y="524.7246">Pr&#233;pare message "Livre non trouv&#233;"</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="224" x="688" y="557.3613"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="204" x="698" y="579.8184">Envoie r&#233;ponse HTTP 404 Not Found</text><polygon fill="#F1F1F1" points="655.75,598.4551,667.75,610.4551,655.75,622.4551,643.75,610.4551,655.75,598.4551" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="214" x="954.5" y="327.9863"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="194" x="964.5" y="350.4434">Pr&#233;pare erreur "Param&#232;tre invalide"</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="239" x="942" y="398.0801"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="219" x="952" y="420.5371">Envoie r&#233;ponse HTTP 400 Bad Request</text><polygon fill="#F1F1F1" points="858.625,632.4551,870.625,644.4551,858.625,656.4551,846.625,644.4551,858.625,632.4551" style="stroke:#181818;stroke-width:0.5;"/><line style="stroke:#000000;stroke-width:1.5;" x1="349" x2="349" y1="51.0645" y2="753.5488"/><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="315" x="1191" y="327.9863"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="121" x="1201" y="350.4434">Ex&#233;cute requ&#234;te SQL :</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="295" x="1201" y="365.5371">SELECT * FROM livre WHERE isbn = ? OR titre LIKE ?</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="128" x="1284.5" y="413.1738"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="108" x="1294.5" y="435.6309">Retourne le r&#233;sultat</text><line style="stroke:#000000;stroke-width:1.5;" x1="1185" x2="1185" y1="51.0645" y2="753.5488"/><line style="stroke:#000000;stroke-width:1.5;" x1="1510" x2="1510" y1="51.0645" y2="753.5488"/><line style="stroke:#181818;stroke-width:1.0;" x1="183" x2="183" y1="98.7051" y2="118.7051"/><polygon fill="#181818" points="179,108.7051,183,118.7051,187,108.7051,183,112.7051" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="183" x2="183" y1="711.5488" y2="731.5488"/><polygon fill="#181818" points="179,721.5488,183,731.5488,187,721.5488,183,725.5488" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="858.625" x2="858.625" y1="208.8926" y2="228.8926"/><polygon fill="#181818" points="854.625,218.8926,858.625,228.8926,862.625,218.8926,858.625,222.8926" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="511.5" x2="511.5" y1="537.3613" y2="557.3613"/><polygon fill="#181818" points="507.5,547.3613,511.5,557.3613,515.5,547.3613,511.5,551.3613" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="800" x2="800" y1="537.3613" y2="557.3613"/><polygon fill="#181818" points="796,547.3613,800,557.3613,804,547.3613,800,551.3613" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="602.75" x2="511.5" y1="48