<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S'inscrire — symfoLivre</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="brand">📚 symfo<span>Livre</span></a>
    <nav>
      <a href="index.html">Accueil</a>
    </nav>
    <div class="nav-actions">
      <a href="login.html" class="btn btn-outline btn-sm" style="color:#fff;border-color:rgba(255,255,255,.4);">Se connecter</a>
    </div>
  </header>

  <main class="container" style="min-height:70vh;display:flex;align-items:center;">

    <div class="form-card" style="width:100%;max-width:520px;">
      <h2>📝 Créer un compte</h2>
      <p class="text-center text-muted text-sm mb-3">Choisissez votre profil et remplissez vos informations</p>

      <!-- Choix du rôle -->
      <div class="role-select">
        <div class="role-option selected" onclick="this.querySelector('input').checked=true">
          <input type="radio" name="role" value="LECTEUR" checked style="display:none;">
          <div class="icon">📖</div>
          <div class="label">Lecteur</div>
          <div class="desc">Lire & télécharger des livres</div>
        </div>
        <div class="role-option" onclick="document.querySelectorAll('.role-option').forEach(o=>o.classList.remove('selected'));this.classList.add('selected')">
          <input type="radio" name="role" value="AUTEUR" style="display:none;">
          <div class="icon">✍️</div>
          <div class="label">Auteur</div>
          <div class="desc">Publier & gérer ses œuvres</div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="firstname">Prénom</label>
          <input type="text" id="firstname" placeholder="Clara">
        </div>
        <div class="form-group">
          <label for="lastname">Nom</label>
          <input type="text" id="lastname" placeholder="Durand">
        </div>
      </div>

      <div class="form-group">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" placeholder="clara.durand@exemple.fr">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="reg-pass">Mot de passe</label>
          <input type="password" id="reg-pass" placeholder="Min. 8 caractères">
        </div>
        <div class="form-group">
          <label for="reg-pass2">Confirmer</label>
          <input type="password" id="reg-pass2" placeholder="••••••••">
        </div>
      </div>

      <button class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-top:.5rem;" onclick="showToast('Compte créé avec succès !'); setTimeout(()=>window.location.href='login.html',1200);">
        Créer mon compte →
      </button>

      <div class="form-footer">
        Déjà inscrit ? <a href="login.html">Se connecter</a>
      </div>
    </div>

  </main>

  <footer class="footer">
    <p>© 2026 <a href="index.html">symfoLivre</a> — Prototype</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
